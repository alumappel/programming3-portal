name = "programming3-editor"
main = "server/worker.js"
compatibility_date = "2026-10-21"

[assets]
directory = "../website"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[vars]
ADMIN_ORIGIN = "https://programming3-editor.alumappel.workers.dev"
PUBLIC_ORIGIN = "https://alumappel.github.io"
GITHUB_REPOSITORY = "alumappel/programming3-content"
GITHUB_BRANCH = "main"

[[d1_databases]]
binding = "DB"
database_name = "programming3-auth"
database_id = "REPLACE-WITH-D1-ID"
migrations_dir = "migrations"

# Set GITHUB_TOKEN, ADMIN_SALT and ADMIN_PASSWORD_HASH through Cloudflare Secrets.
# Never put secrets in this file or in dist/.
